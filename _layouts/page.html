<!DOCTYPE HTML>
<html lang="en">
{% include head.html %}
<body>
  <div class="page">
    {% include sidebar.html %}
    <main>
      <table class="dated">
        {% assign posts = site.posts | where: 'categories', 'blog' %}
        {% for post in posts %}
        <tr>
          <td class="date">{{ post.date | date: "%-m/%-d/%y" }}</td>
          <td><a href="{{ post.url | relative_url }}">{{ post.title }}</a></td>
        </tr>
        {% endfor %}
      </table>
    </main>
  </div>
</body>
</html>
