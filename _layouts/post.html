<!DOCTYPE HTML>
<html lang="en">
{% include head.html %}
<body>
  {% if page.math or page.mathjax %}{% include mathjax.html %}{% endif %}
  <div class="page">
    {% include sidebar.html %}
    <main>
      <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="post-byline">
          <em>{{ page.date | date: "%B %d, %Y" }}</em>
          {% if page.author %} • by {{ page.author }}{% endif %}
        </p>
      </header>
      <div class="blog-content">
        {{ content }}
      </div>
    </main>
  </div>
</body>
</html>
